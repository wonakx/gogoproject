# Source of truth. Edit this file, then run go generate ./api.
openapi: "3.0.3"
info:
  title: "Dealer API"
  version: "1.0.0"
  description: "회원·상품·판매·구매 모듈 API. 이 명세가 요청·응답 계약의 기준입니다. 첫 번째 JSON 값만 처리하고 뒤에 붙은 데이터는 무시합니다. 첫 JSON을 읽는 크기는 1 MiB로 제한합니다. Content-Type 생략 시 application/json으로 처리합니다. 인증은 아직 제공하지 않습니다. 날짜는 시간대가 포함된 RFC3339입니다."
tags:
  - name: "member"
    description: "회원"
  - name: "product"
    description: "상품"
  - name: "sale"
    description: "판매"
  - name: "purchase"
    description: "구매·이력"
  - name: "system"
    description: "운영 상태"
paths:
  "/health":
    get:
      operationId: "Health"
      tags: ["system"]
      summary: "상태 확인"
      responses:
        "200":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HealthResponse"
  "/api/v1/members":
    post:
      operationId: "CreateMember"
      tags: ["member"]
      summary: "회원 등록"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MemberResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "중복 키, 재고 부족 또는 판매 불가"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/members/{member_no}":
    get:
      operationId: "GetMember"
      tags: ["member"]
      summary: "회원 조회"
      parameters:
        - name: "member_no"
          in: "path"
          required: true
          description: "양수 정수 PK"
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            description: "리소스 번호"
            maximum: 9223372036854775807
      responses:
        "200":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MemberResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    put:
      operationId: "UpdateMember"
      tags: ["member"]
      summary: "회원 전체 수정"
      parameters:
        - name: "member_no"
          in: "path"
          required: true
          description: "양수 정수 PK"
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            description: "리소스 번호"
            maximum: 9223372036854775807
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MemberResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "중복 키, 재고 부족 또는 판매 불가"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    delete:
      operationId: "DeleteMember"
      tags: ["member"]
      summary: "회원 삭제"
      parameters:
        - name: "member_no"
          in: "path"
          required: true
          description: "양수 정수 PK"
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            description: "리소스 번호"
            maximum: 9223372036854775807
      responses:
        "204":
          description: "삭제 완료. 응답 본문 없음."
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/products":
    post:
      operationId: "CreateProduct"
      tags: ["product"]
      summary: "상품 등록"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "중복 키, 재고 부족 또는 판매 불가"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/products/{product_no}":
    get:
      operationId: "GetProduct"
      tags: ["product"]
      summary: "상품 조회"
      parameters:
        - name: "product_no"
          in: "path"
          required: true
          description: "양수 정수 PK"
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            description: "리소스 번호"
            maximum: 9223372036854775807
      responses:
        "200":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/sales":
    post:
      operationId: "CreateSale"
      tags: ["sale"]
      summary: "판매 등록"
      description: "판매자와 상품이 존재해야 합니다. 가격·수량은 양수이며 종료 시각은 시작 시각보다 뒤여야 합니다."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateSaleRequest"
      responses:
        "201":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SaleResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "중복 키, 재고 부족 또는 판매 불가"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/sales/{sale_no}":
    get:
      operationId: "GetSale"
      tags: ["sale"]
      summary: "판매 조회"
      parameters:
        - name: "sale_no"
          in: "path"
          required: true
          description: "양수 정수 PK"
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            description: "리소스 번호"
            maximum: 9223372036854775807
      responses:
        "200":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SaleResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/purchases":
    post:
      operationId: "CreatePurchase"
      tags: ["purchase"]
      summary: "구매 생성"
      description: "판매자 번호는 판매 정보에서 가져옵니다. 자기 판매 구매를 거부합니다. 판매 상태·기간·재고를 확인하고 재고 차감, 구매, 이력을 하나의 트랜잭션으로 저장합니다. 멱등성 키를 지원하지 않습니다."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreatePurchaseRequest"
      responses:
        "201":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PurchaseResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "중복 키, 재고 부족 또는 판매 불가"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/purchases/{purchase_no}":
    get:
      operationId: "GetPurchase"
      tags: ["purchase"]
      summary: "구매 조회"
      parameters:
        - name: "purchase_no"
          in: "path"
          required: true
          description: "양수 정수 PK"
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            description: "리소스 번호"
            maximum: 9223372036854775807
      responses:
        "200":
          description: "성공"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PurchaseResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/purchases/{purchase_no}/histories":
    get:
      operationId: "ListPurchaseHistories"
      tags: ["purchase"]
      summary: "구매 이력 조회"
      parameters:
        - name: "purchase_no"
          in: "path"
          required: true
          description: "양수 정수 PK"
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            description: "리소스 번호"
            maximum: 9223372036854775807
      responses:
        "200":
          description: "성공"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/PurchaseHistoryResponse"
        "400":
          description: "입력 형식 또는 업무 규칙 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "대상 데이터 없음"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "내부 서버 오류"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: "object"
      required: ["error"]
      properties:
        error:
          type: "string"
          description: "오류 설명"
      additionalProperties: false
    HealthResponse:
      type: "object"
      required: ["status"]
      properties:
        status:
          type: "string"
          description: "서버 상태"
          enum: ["ok"]
      additionalProperties: false
    CreateMemberRequest:
      type: "object"
      required: ["id"]
      properties:
        id:
          type: "string"
          description: "회원 로그인 ID. 이메일과 달리 유일해야 합니다."
          minLength: 1
          maxLength: 100
          "x-go-name": "ID"
        email:
          type: "string"
          description: "이메일. 중복 허용."
          nullable: true
          maxLength: 200
        address:
          type: "string"
          description: "주소"
          nullable: true
          maxLength: 300
        phone_number:
          type: "string"
          description: "전화번호"
          nullable: true
          maxLength: 100
    UpdateMemberRequest:
      type: "object"
      required: ["id"]
      properties:
        id:
          type: "string"
          description: "회원 로그인 ID. 이메일과 달리 유일해야 합니다."
          minLength: 1
          maxLength: 100
          "x-go-name": "ID"
        email:
          type: "string"
          description: "이메일. 중복 허용."
          nullable: true
          maxLength: 200
        address:
          type: "string"
          description: "주소"
          nullable: true
          maxLength: 300
        phone_number:
          type: "string"
          description: "전화번호"
          nullable: true
          maxLength: 100
      description: "전체 교체입니다. 생략하거나 null로 지정한 연락처는 NULL로 저장됩니다."
    MemberResponse:
      type: "object"
      required: ["member_no", "id", "email", "address", "phone_number", "create_at", "update_at"]
      properties:
        member_no:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "회원 번호"
          maximum: 9223372036854775807
        id:
          type: "string"
          description: "회원 로그인 ID. 이메일과 달리 유일해야 합니다."
          minLength: 1
          maxLength: 100
          "x-go-name": "ID"
        email:
          type: "string"
          description: "이메일. 중복 허용."
          nullable: true
          maxLength: 200
        address:
          type: "string"
          description: "주소"
          nullable: true
          maxLength: 300
        phone_number:
          type: "string"
          description: "전화번호"
          nullable: true
          maxLength: 100
        create_at:
          type: "string"
          description: "서버에서 지정한 생성 시각"
          format: "date-time"
        update_at:
          type: "string"
          description: "최근 변경 시각"
          format: "date-time"
          nullable: true
      additionalProperties: false
    CreateProductRequest:
      type: "object"
      required: ["product_code"]
      properties:
        product_code:
          type: "string"
          description: "유일한 상품 코드"
          minLength: 1
          maxLength: 100
        name:
          type: "string"
          description: "상품명"
          nullable: true
          maxLength: 200
        description:
          type: "string"
          description: "상품 설명"
          nullable: true
      additionalProperties: false
    ProductResponse:
      type: "object"
      required: ["product_no", "product_code", "name", "description", "create_at", "update_at"]
      properties:
        product_no:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "상품 번호"
          maximum: 9223372036854775807
        product_code:
          type: "string"
          description: "유일한 상품 코드"
          minLength: 1
          maxLength: 100
        name:
          type: "string"
          description: "상품명"
          nullable: true
          maxLength: 200
        description:
          type: "string"
          description: "상품 설명"
          nullable: true
        create_at:
          type: "string"
          description: "서버에서 지정한 생성 시각"
          format: "date-time"
        update_at:
          type: "string"
          description: "최근 변경 시각"
          format: "date-time"
          nullable: true
      additionalProperties: false
    SaleStatus:
      type: "string"
      description: "ACTIVE: 판매 가능, CLOSED: 판매 종료"
      enum: ["ACTIVE", "CLOSED"]
    CreateSaleRequest:
      type: "object"
      required: ["sell_member_no", "product_no", "quantity", "price", "status", "start_at"]
      properties:
        sell_member_no:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "판매자 회원 번호"
          maximum: 9223372036854775807
        product_no:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "상품 번호"
          maximum: 9223372036854775807
        name:
          type: "string"
          description: "판매명"
          nullable: true
          maxLength: 200
        description:
          type: "string"
          description: "판매 설명"
          nullable: true
        quantity:
          type: "integer"
          format: "int32"
          minimum: 1
          description: "판매 재고 수량"
          maximum: 2147483647
        price:
          type: "string"
          description: "소수점 오차를 피하기 위한 금액 문자열. 양수, 최대 99999999.99."
          pattern: "^[0-9]{1,8}(\\.[0-9]{1,2})?$"
          example: "12000.50"
        status:
          "$ref": "#/components/schemas/SaleStatus"
        start_at:
          type: "string"
          description: "판매 시작 시각"
          format: "date-time"
        end_at:
          type: "string"
          description: "판매 종료 시각. null이면 종료 기한 없음."
          format: "date-time"
          nullable: true
      additionalProperties: false
    SaleResponse:
      type: "object"
      required: ["sale_no", "sell_member_no", "product_no", "name", "description", "quantity", "price", "status", "start_at", "end_at", "create_at", "update_at"]
      properties:
        sale_no:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "판매 번호"
          maximum: 9223372036854775807
        sell_member_no:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "판매자 회원 번호"
          maximum: 9223372036854775807
        product_no:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "상품 번호"
          maximum: 9223372036854775807
        name:
          type: "string"
          description: "판매명"
          nullable: true
          maxLength: 200
        description:
          type: "string"
